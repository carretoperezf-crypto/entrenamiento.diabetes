<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predicción de riesgo de diabetes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Predicción de riesgo de diabetes</h1>

        <p>
            Ingresa los datos del paciente para realizar la predicción.
        </p>

        <form id="formularioPaciente">

            <label for="sexo">Sexo:</label>
            <select id="sexo" name="sexo" required>
                <option value="">Seleccionar</option>
                <option value="0">Femenino</option>
                <option value="1">Masculino</option>
            </select>

            <label for="edad">Edad:</label>
            <input
                type="number"
                id="edad"
                name="edad"
                min="1"
                max="120"
                required
            >
            <label for="peso">Peso (kg):</label>
            <input
                type="number"
                id="peso"
                name="peso"
                step="0.01"
                min="1"
                required
            >
            <label for="estatura">Estatura (cm):</label>
            <input
                type="number"
                id="estatura"
                name="estatura"
                step="0.01"
                min="50"
                max="250"
                required
            >
            <label for="imc">IMC:</label>
            <input
                type="number"
                id="imc"
                name="imc"
                step="0.01"
                required
            >
            <label for="muestra_suero">Muestra de suero:</label>
            <input
                type="number"
                id="muestra_suero"
                name="muestra_suero"
                step="0.01"
                required
>
            <label for="glu_suero">Glucosa en suero:</label>
            <input
                type="number"
                id="glu_suero"
                name="glu_suero"
                step="0.01"
                required
            >
            <label for="insulina">Insulina:</label>
            <input
                type="number"
                id="insulina"
                name="insulina"
                step="0.01"
                required
            >
            <label for="trig">Triglicéridos:</label>
            <input
                type="number"
                id="trig"
                name="trig"
                step="0.01"
                required
            >
            <label for="colest">Colesterol:</label>
            <input
                type="number"
                id="colest"
                name="colest"
                step="0.01"
                required
            >
            <label for="creat">Creatinina:</label>
            <input
                type="number"
                id="creat"
                name="creat"
                step="0.01"
                required
            >
            <button type="submit">
                Realizar predicción
            </button>
        </form>

        <div id="resultado">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
